 $('timing').hidden=true;$('timing-file').value='';$('timing-file').disabled=true;$('timing-note').textContent='';
 $('plot').style.display='none';$('empty').style.display='block';$('channels').replaceChildren();
 $('notice').textContent='';$('metadata').textContent='';$('position').textContent='尚无记录';
 $('status').textContent='正在校验并读取本地文件…';
 try{
  need(file.size<=64*1024*1024,'初版单文件上限为 64 MiB');
  const parsed=await parseCapture(await file.arrayBuffer());
  if(ticket!==generation)return;
  data=parsed;selected=0;axis.value=data.clockMismatch?'record':'source';axis.disabled=false;fitView();
  $('cursor').max=data.count-1;$('timing-file').disabled=!data.complete;
  $('empty').style.display='none';$('plot').style.display='block';
  $('status').textContent=`${file.name} · ${data.count.toLocaleString()} 条完整记录 · ${data.channels.length} 通道 · ${data.state}`;
  $('notice').textContent=data.warnings.join('\n');
  $('metadata').textContent=JSON.stringify({header:data.header,manifest:data.manifest,verified_payload_sha256:data.sha},null,2);
  showTiming();render();
 }catch(e){
  if(ticket!==generation)return;
  $('status').textContent=`无法打开：${e.message}`;$('empty').textContent='请选择受支持且包含有效记录的文件。';data=null;
 }
}
async function loadTiming(file){
 const capture=data,ticket=++timingGeneration;
 if(!capture?.complete)return;
 hostWindowUs=null;showTiming();
 try{
  need(file.size<=16*1024*1024,'诊断 JSON 超出 16 MiB');
  const receipt=JSON.parse(await file.text());
  if(data!==capture||ticket!==timingGeneration)return;
  hostWindowUs=measuredHostWindow(receipt,capture);showTiming();
  $('timing-note').textContent=`已关联诊断计时：${file.name}`;
 }catch(e){
  if(data!==capture||ticket!==timingGeneration)return;
  $('timing-note').textContent=`无法关联诊断计时：${e.message}`;
 }
}
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
$('timing-file').onchange=e=>{if(e.target.files[0])loadTiming(e.target.files[0])};
axis.onchange=$('fit').onclick=()=>{if(data){fitView();render()}};
$('cursor').oninput=e=>select(Number(e.target.value),true);
$('prev').onclick=()=>select(selected-1,true);
$('next').onclick=()=>select(selected+1,true);
$('zoom').onclick=()=>zoomAtSelection(.5);
$('zoom-out').onclick=()=>zoomAtSelection(2);
selectAll.onchange=()=>{
 if(!data)return;
 for(const channel of data.channels)channel.enabled=selectAll.checked;
 render();
};
cv.onclick=e=>{if(!data)return;const r=cv.getBoundingClientRect(),t=view[0]+(e.clientX-r.left-54)/(r.width-78)*(view[1]-view[0]);let nearest=0,dist=Infinity;for(let i=0;i<data.count;i++){const d=Math.abs(xValue(i)-t);if(d<dist){dist=d;nearest=i}}select(nearest)};window.addEventListener('resize',render);
window.HssViewer={parseCapture,loadFile,getData:()=>data};
</script></body></html>
