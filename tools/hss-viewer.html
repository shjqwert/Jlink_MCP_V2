<style>

</style></head><body>
<header><div><h1>HSS <span style="color:#72a7ff">/</span> 离线波形</h1><p>原始时间与原始值 · 所有数据留在本机</p></div><label class="file">导入采集文件 <input id="file" type="file" accept=".capture,.partial" aria-label="导入采集文件"></label></header>
<div id="viewer-toolbar" class="toolbar">
 <button id="fit" aria-keyshortcuts="Control+H">显示全部 <kbd>Ctrl+H</kbd></button>
 <button id="zoom" title="以当前选中点为锚点放大横轴（]）" disabled>＋ 横向放大</button>
 <button id="zoom-out" title="以当前选中点为锚点缩小横轴（[）" disabled>－ 横向缩小</button>
 <label>横轴 <select id="axis" disabled><option value="source">源时间（ms）</option><option value="record">记录序号</option></select></label>
 <div id="scale-scope" class="keyboard-scales" role="group" aria-label="纵轴快捷键调节范围" hidden>
  <span>纵轴 − / +</span>
  <button type="button" data-scope="current" aria-pressed="true">当前通道</button>
  <button type="button" data-scope="checked" aria-pressed="false">已勾选通道</button>
  <span id="scale-target" aria-live="polite"></span>
 </div>
</div>
<section class="panel">
 <div id="status" role="status">等待导入 .capture / .partial 文件</div>
 <dl id="timing" class="timing" hidden><div><dt>主机采集窗口</dt><dd id="host-window"></dd><small id="host-basis"></small></div><div><dt>源时间跨度</dt><dd id="source-span"></dd><small id="source-bounds"></small></div></dl>
 <p id="notice"></p><div id="empty">导入本地采集文件，开始查看波形。<br><p>按文件顺序查看全部通过校验的完整记录。</p></div>
 <div id="plot-caption" class="plot-caption" hidden><span><strong>纵轴固定</strong> <span id="scale-reference"></span></span><span id="scale-overflow" role="status"></span></div>
 <div id="plot-area" class="plot-area" hidden>
  <canvas id="plot" tabindex="0" aria-label="统一通道波形图"></canvas>
  <div class="vertical-pan">
   <label for="vertical-pan">纵轴位置</label>
   <input id="vertical-pan" type="range" orient="vertical" min="0" max="1000" step="1" aria-orientation="vertical" disabled>
   <output id="vertical-center" for="vertical-pan" aria-label="纵轴中心" aria-live="off">—</output>
  </div>
 </div>
 <div class="controls"><button id="prev" aria-label="上一条记录">←</button><input id="cursor" type="range" min="0" max="0" value="0" aria-label="记录索引"><button id="next" aria-label="下一条记录">→</button><span id="position">尚无记录</span></div>
 <div class="channel-controls"><label><input id="select-all" type="checkbox" disabled>全选</label><span id="channel-count"></span></div>
 <div id="channel-table" class="table-scroll" role="region" aria-label="通道原始值和纵轴比例，可横向滚动" tabindex="0"><table><thead><tr><th>通道</th><th>当前原始值</th><th>可见最小值</th><th>可见最大值</th><th>纵轴比例</th></tr></thead><tbody id="channels"></tbody></table></div>
</section>
<dialog id="scale-dialog" aria-labelledby="scale-title">
 <form id="scale-form" method="dialog">
  <h2 id="scale-title">导入时设置纵轴</h2>
  <label id="scale-mode-label">初始比例<select id="scale-mode"><option value="auto">按全文件适配一次</option><option value="manual">手动设置通道</option></select></label>
  <div id="scale-fields" hidden>
   <label>通道<select id="scale-channel"></select></label>
   <label>每格数值（原始单位）<input id="scale-value" type="number" step="any" required></label>
   <label>纵轴中心<input id="scale-center" type="number" step="any" required></label>
  </div>
  <div class="dialog-actions"><button type="submit" value="cancel" formnovalidate>取消</button><button type="submit" value="apply">应用</button></div>
 </form>
</dialog>
<details id="details"><summary>文件信息与质量证据</summary><p><label>关联同次采集的诊断计时（可选） <input id="timing-file" type="file" accept=".json" disabled></label></p><p id="timing-note" role="status"></p><pre id="metadata"></pre></details><footer>离线初版 · 支持 JMCPV101 自描述格式，单文件上限 64 MiB。点密集时按屏幕像素保留首尾点和极值，放大或按记录逐点查看。64 位超安全整数保留精确文本，不绘制不可靠幅值。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), palette=['#65a4ff','#52d7b4','#f5bf65','#c199ff','#ff839b','#6bd4eb','#a4ca6b','#e994cf','#c0b18c','#d7e6fc'];
const crcTable=Uint32Array.from({length:256},(_,i)=>{for(let k=0;k<8;k++)i=i&1?0xedb88320^(i>>>1):i>>>1;return i>>>0});
function crc32(b){let c=0xffffffff;for(const v of b)c=crcTable[(c^v)&255]^(c>>>8);return (c^0xffffffff)>>>0}
const decoder=new TextDecoder('utf-8',{fatal:true});
function need(v,m){if(!v)throw Error(m)}
function integer(v,min,max,m){need(Number.isSafeInteger(v)&&v>=min&&v<=max,m);return v}
async function parseCapture(buffer){
 const b=new Uint8Array(buffer),v=new DataView(buffer),str=(p,n)=>String.fromCharCode(...b.subarray(p,p+n));
 need(b.length>=20&&str(0,8)==='JMCPV101','不是受支持的 JMCPV101 采集文件');need(v.getUint32(8,true)===1,'不支持的文件版本');
 function jsonAt(p,n,crc){need(n<=16*1024*1024&&p+n<=b.length,'JSON 区段不完整或过大');const data=b.subarray(p,p+n);need(crc32(data)===crc,'JSON CRC 校验失败');return JSON.parse(decoder.decode(data))}
 const hl=v.getUint32(12,true),h=jsonAt(20,hl,v.getUint32(16,true));
 need(h.plan&&Array.isArray(h.plan.variables)&&h.plan.variables.length>0&&h.plan.variables.length<=10,'变量计划无效');
 need(h.capture_key===h.plan.capture_key&&h.request_fingerprint===h.plan.request_fingerprint,'文件身份与计划不一致');
 const rb=integer(h.plan.frame_layout?.record_bytes,5,44,'记录布局无效');need(h.plan.frame_layout.sample_bytes===rb-4,'记录载荷不一致');
 let p=20+hl,parts=[],blocks=0,total=0,manifest=null,warnings=[],complete=false;
 while(p<b.length){
  if(p+4>b.length){warnings.push('文件末尾不完整');break}
  const magic=str(p,4);
  if(magic==='END1'){
   try{need(p+12<=b.length,'终态头不完整');const n=v.getUint32(p+4,true);manifest=jsonAt(p+12,n,v.getUint32(p+8,true));need(p+12+n===b.length,'终态后存在额外字节');complete=true}catch(e){manifest=null;warnings.push(e.message)}break;
  }
  if(magic!=='BLK1'||p+24>b.length){warnings.push('块标记或块头不完整，只展示此前有效前缀');break}
  const n=v.getUint32(p+4,true),crc=v.getUint32(p+8,true),phase=v.getUint32(p+20,true);
  if(n>16*1024*1024||p+24+n>b.length||phase>1){warnings.push('数据块不完整或块头无效，只展示此前有效前缀');break}
  const data=b.subarray(p+24,p+24+n);if(crc32(data)!==crc){warnings.push('数据块 CRC 错误，只展示此前已通过校验的前缀');break}
  parts.push(data);total+=n;blocks++;p+=24+n;
 }
 const raw=new Uint8Array(total);let off=0;for(const part of parts){raw.set(part,off);off+=part.length}
 let sha=null;
 if(complete){sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',raw)),x=>x.toString(16).padStart(2,'0')).join('');
  need(manifest.blocks===blocks&&manifest.payload_bytes===total&&manifest.raw_sha256===sha,'终态摘要或字节数不匹配');
  need(manifest.snapshot?.capture_id===h.capture_id,'终态采集身份不匹配');need(total%rb===0,'完整文件含不完整记录');
 }
 const count=Math.floor(total/rb);need(count>0,'没有可展示的完整记录');
 if(complete){need(manifest.snapshot.complete_records===count&&manifest.snapshot.quality?.actual_samples===count,'终态记录数量不匹配')}
 else warnings.push('partial：仅展示校验通过的完整记录，完整性未知');
 if(total%rb)warnings.push('末尾不足一条记录的字节未绘制，源文件保持原样');
 const dv=new DataView(raw.buffer),times=new Float64Array(count);let equal=0,backward=0,minT=Infinity,maxT=-Infinity;
 for(let i=0;i<count;i++){times[i]=dv.getUint32(i*rb,true);minT=Math.min(minT,times[i]);maxT=Math.max(maxT,times[i]);if(i){equal+=times[i]===times[i-1];backward+=times[i]<times[i-1]}}
 if(equal)warnings.push(`相邻相等时间戳 ${equal} 次，所有记录均保留；用记录滑块区分同一时刻的点`);
 if(backward)warnings.push(`时间倒退 ${backward} 次，按原顺序绘制，不修正时间`);
 const channels=[];
 function expand(layout,name,offset,span,bit=null,depth=0){
  need(depth<=16&&channels.length<128,'类型层级或通道数超出初版限制');integer(offset,4,rb-1,'通道偏移无效');integer(span,1,rb-offset,'通道超出记录');
  if(layout.kind==='array'){const n=integer(layout.count,1,40,'数组长度无效'),size=span/n;need(Number.isInteger(size),'数组字节数无效');for(let i=0;i<n;i++)expand(layout.element,`${name}[${i}]`,offset+i*size,size,null,depth+1);return}
  if(layout.kind==='structure'){
   need(Array.isArray(layout.members),'结构体成员无效');for(const m of layout.members){if(m.bit_size!=null){warnings.push(`${name}.${m.name}：成员位域暂不绘制`);continue}let size=m.layout.byte_size;if(m.layout.kind==='array')size=sizeOf(m.layout);expand(m.layout,`${name}.${m.name}`,offset+integer(m.byte_offset,0,span-1,'成员偏移无效'),integer(size,1,span-m.byte_offset,'成员大小无效'),null,depth+1)}return;
  }
  if(!['scalar','pointer'].includes(layout.kind)){warnings.push(`${name}：${layout.kind} 类型暂不绘制，原始字节保留`);return}
  const size=integer(layout.byte_size,1,8,'标量长度无效'),enc=layout.kind==='pointer'?'unsigned':layout.encoding;
  if(![1,2,4,8].includes(size)||!['signed','unsigned','float','boolean'].includes(enc)||size>span||(enc==='float'&&![4,8].includes(size))){warnings.push(`${name}：不支持的标量类型`);return}
  if(bit){integer(bit.lsb,0,size*8-1,'位域起点无效');integer(bit.width,1,size*8-bit.lsb,'位域宽度无效');need(enc!=='float','浮点位域无效')}
  function value(i){const pos=i*rb+offset;if(enc==='float')return size===4?dv.getFloat32(pos,true):dv.getFloat64(pos,true);
   let n=0n;for(let j=0;j<size;j++)n|=BigInt(dv.getUint8(pos+j))<<BigInt(j*8);
   let bits=size*8;if(bit){bits=bit.width;n=(n>>BigInt(bit.lsb))&((1n<<BigInt(bits))-1n)}if(enc==='signed')n=BigInt.asIntN(bits,n);
   if(enc==='boolean')return n!==0n?1:0;return n>=-9007199254740991n&&n<=9007199254740991n?Number(n):n;
  }
  channels.push({name,value,enabled:true,color:palette[channels.length%palette.length]});
 }
 function sizeOf(l){return l.kind==='array'?integer(l.count,1,40,'数组长度无效')*sizeOf(l.element):l.byte_size}
 for(const item of h.plan.variables){
  if(!item.plan){warnings.push('本初版仅解码 DWARF 类型通道，raw-address 元数据保留在文件信息中');continue}
  const ap=item.plan;expand(ap.layout,ap.selector.path,4+integer(item.sample_offset,0,rb-5,'样本偏移无效'),integer(ap.byte_size,1,rb-4,'变量长度无效'),ap.bit_range);
 }
 const quality=manifest?.snapshot?.quality||{integrity:'unknown'},state=complete?manifest.snapshot.state:'aborted / partial';
 const clockMismatch=quality.reason_codes?.includes('source_host_clock_mismatch')??false;
 if(clockMismatch)warnings.push('源时间与主机窗口存在偏差。全部完整记录可用于值和顺序分析，物理周期或延迟需另有时间依据。');
 const otherReasons=quality.reason_codes?.filter(code=>code!=='source_host_clock_mismatch');
 if(otherReasons?.length)warnings.push(`质量提示：${otherReasons.join('、')}`);
 return {header:h,manifest,raw,times,count,channels,minT,maxT,equal,backward,warnings,complete,state,quality,sha,clockMismatch};
}
let data=null,selected=0,view=[0,1],generation=0,timingGeneration=0,hostWindowUs=null;
const axis=$('axis'),selectAll=$('select-all');
function xValue(i){return axis.value==='record'?i+1:data.times[i]}
function fullRange(){
 const [start,end]=axis.value==='record'?[1,data.count]:[data.minT,data.maxT];
 return [start,end>start?end:start+1];
}
function fitView(){view=fullRange()}
function centerViewOnSelection(requestedSpan){
 const [min,max]=fullRange();
 const span=Math.min(max-min,Math.max(1,requestedSpan));
 const start=Math.max(min,Math.min(xValue(selected)-span/2,max-span));
 view=[start,start+span];
}
function zoomAtSelection(scale){
 if(!data)return;
 centerViewOnSelection((view[1]-view[0])*scale);
 render();
}
function updateChannelSelection(){
 const total=data?.channels.length??0;
 const enabled=data?.channels.filter(channel=>channel.enabled).length??0;
 selectAll.disabled=total===0;
 selectAll.checked=total>0&&enabled===total;
 selectAll.indeterminate=enabled>0&&enabled<total;
 $('channel-count').textContent=total?`已选 ${enabled} / ${total}`:'';
}
function showTiming(){
 const seconds=us=>`${(us/1e6).toFixed(3)} 秒`;
 const requested=data.header.plan.duration_s;
 const hasRequest=Number.isSafeInteger(requested)&&requested>0;
 $('host-window').textContent=hostWindowUs!==null?seconds(hostWindowUs):hasRequest?seconds(requested*1e6):'未记录';
 $('host-basis').textContent=hostWindowUs!==null?'实测 · Start 返回至 Stop 调用':hasRequest?'请求时长 · 实测 Stop 边界未记录':'未记录请求时长或实测边界';
 $('source-span').textContent=seconds((data.maxT-data.minT)*1000);
 $('source-bounds').textContent=`${data.minT}–${data.maxT} ms · ${data.complete?'文件源时间':'有效前缀的源时间'}`;
 $('timing').hidden=false;
}
function measuredHostWindow(receipt,capture){
 need(capture.complete&&receipt.raw_sha256===capture.sha&&receipt.plan?.request_fingerprint===capture.header.plan.request_fingerprint,'诊断记录与当前文件的载荷或计划不匹配');
 need(receipt.record_bytes===capture.header.plan.frame_layout.record_bytes&&
      Number.isSafeInteger(receipt.live_bytes)&&receipt.live_bytes>=0&&
      Number.isSafeInteger(receipt.tail_bytes)&&receipt.tail_bytes>=0&&
      receipt.live_bytes+receipt.tail_bytes===capture.raw.length,'诊断记录与当前文件的字节数不匹配');
 const {T0_us,T1_us,T2_us,T3_us,T4_us}=receipt;
 need([T0_us,T1_us,T2_us,T3_us,T4_us].every(t=>Number.isSafeInteger(t)&&t>=0)&&
      T0_us<=T1_us&&T1_us<T2_us&&T2_us<=T3_us&&T3_us<=T4_us,'诊断记录的主机计时边界无效');

const cv=$('plot'),ctx=cv.getContext('2d');
const verticalPan=$('vertical-pan'),verticalCenter=$('vertical-center');
function textCell(row,text,cls=''){const td=document.createElement('td');td.className=cls;td.textContent=text;row.append(td);return td}
const format=String;
const scaleDialog=$('scale-dialog'),scaleMode=$('scale-mode'),scaleChannel=$('scale-channel');
const scaleValue=$('scale-value'),scaleCenter=$('scale-center');
const scaleScope=$('scale-scope'),scaleScopeButtons=[...scaleScope.querySelectorAll('button')];
let currentChannel=null,keyboardScaleScope='current',scaleDrafts=new Map(),visibleRanges=null;
let pendingPanRender=false;
const yDivisions=4,plotLeft=78,plotRight=24;

function plotNumber(value){return Number.isFinite(value)?String(Number(value.toPrecision(6))):'—'}
function isPlotNumber(value){return typeof value==='number'&&Number.isFinite(value)}
function bounds(channel,windowRange){
 let min=Infinity,max=-Infinity;
 for(let i=0;i<data.count;i++){
  if(windowRange){
   const x=xValue(i);
   if(x<windowRange[0]||x>windowRange[1])continue;
  }
  const value=channel.value(i);
  if(isPlotNumber(value)){min=Math.min(min,value);max=Math.max(max,value)}

}
function neighboringScale(scale,larger){
 const exponent=Math.floor(Math.log10(scale));
 let best=larger?Infinity:0;
 for(let power=Math.max(-324,exponent-1);power<=Math.min(308,exponent+1);power++){
  for(const multiplier of [1,2,5]){
   const step=Number(multiplier+'e'+power);
   if(larger&&step>scale&&step<best)best=step;
   if(!larger&&step<scale&&step>best)best=step;
  }

 return best>0&&Number.isFinite(best)?best:scale;
}
function suggestedScale({min,max}){
 if(!Number.isFinite(min))return null;
 const center=min===max?min:min/2+max/2;
 // Divide before subtracting so even a span across both signed float limits fits.
 const required=min===max?Math.abs(center)*.1||1:(max/yDivisions-min/yDivisions)*1.1;
 return {center,scale:neighboringScale(Math.max(Number.MIN_VALUE,required),true)};
}
function divisionsFromCenter(value,{center,scale}){
 const delta=value-center;

}
function panBounds({min,max},{center,scale}){
 const padding=max*.08-min*.08||scale;
 return {min:Math.min(Math.max(-Number.MAX_VALUE,min-padding),center),
         max:Math.max(Math.min(Number.MAX_VALUE,max+padding),center)};
}
function updateVerticalPan(){
 const channel=currentChannel;
 verticalPan.disabled=!channel?.enabled;
 if(!channel){
  verticalCenter.textContent='—';
  verticalPan.removeAttribute('aria-valuetext');
  return;
 }
 const {min,max}=channel.panBounds,center=channel.vertical.center;
 const span=max-min;
 const fraction=Number.isFinite(span)?(center-min)/span:(center/2-min/2)/(max/2-min/2);
 verticalPan.valueAsNumber=Math.round(fraction*Number(verticalPan.max));
 const shown=plotNumber(center);
 verticalCenter.textContent=channel.enabled?shown:'未显示';
 verticalPan.setAttribute('aria-valuetext',`${channel.name} · 纵轴中心 ${shown}`);
}
verticalPan.oninput=()=>{
 const channel=currentChannel;
 if(!channel?.enabled)return;
 const {min,max}=channel.panBounds,fraction=verticalPan.valueAsNumber/Number(verticalPan.max);
 const span=max-min;
 const center=Number.isFinite(span)?min+span*fraction:min*(1-fraction)+max*fraction;
 channel.vertical.center=Math.max(min,Math.min(max,center));
 if(pendingPanRender)return;
 pendingPanRender=true;
 requestAnimationFrame(()=>{pendingPanRender=false;render()});
};
function setChannelScale(channel,setting){
 channel.vertical=setting;
 channel.panBounds.min=Math.min(channel.panBounds.min,setting.center);
 channel.panBounds.max=Math.max(channel.panBounds.max,setting.center);
 currentChannel=channel;
}
function setupChannelRows(){
 const table=$('channels');
 table.replaceChildren();
 for(const channel of data.channels){
  channel.fullBounds=bounds(channel);
  channel.vertical=suggestedScale(channel.fullBounds);
  if(channel.vertical)channel.panBounds=panBounds(channel.fullBounds,channel.vertical);
  const row=document.createElement('tr'),nameCell=textCell(row,'');
  const checkbox=document.createElement('input');
  checkbox.type='checkbox';checkbox.checked=channel.enabled;
  checkbox.setAttribute('aria-label',`显示 ${channel.name}`);
  checkbox.onchange=()=>{channel.enabled=checkbox.checked;render()};
  const dot=document.createElement('span');
  dot.className='dot';dot.style.background=channel.color;
  const name=document.createElement('button');
  name.type='button';name.className='channel-name';name.textContent=channel.name;
  name.disabled=!channel.vertical;
  name.onclick=()=>{currentChannel=channel;render()};
  nameCell.append(checkbox,dot,name);
  const readings=['','',''].map(text=>textCell(row,text,'value'));
  const cell=textCell(row,'','scale-cell');
  const controls=document.createElement('div');
  controls.className='scale-controls';
  const buttons=['−','','+'].map((label,i)=>{
   const button=document.createElement('button');
   button.type='button';button.textContent=label;button.disabled=!channel.vertical;
   button.setAttribute('aria-label',`${['缩小','设置','放大'][i]} ${channel.name} 纵轴`);
   controls.append(button);
   return button;
  });
  buttons[0].onclick=()=>adjustScale(channel,true);
  buttons[1].onclick=()=>openScaleDialog(channel);
  buttons[2].onclick=()=>adjustScale(channel,false);
  const overflow=document.createElement('span');
  overflow.className='scale-note';overflow.hidden=true;
  cell.append(controls,overflow);
  table.append(row);
  channel.row={row,name,checkbox,readings,scale:buttons[1],overflow};
 }
 currentChannel=data.channels.find(channel=>channel.vertical)??null;
}
function adjustScale(channel,larger){
 const {center,scale}=channel.vertical;
 setChannelScale(channel,{center,scale:neighboringScale(scale,larger)});
 render();
}
function checkedScaleChannels(){
 return data.channels.filter(channel=>channel.enabled&&channel.vertical);
}
function updateScaleTarget(){
 for(const button of scaleScopeButtons){
  button.setAttribute('aria-pressed',String(button.dataset.scope===keyboardScaleScope));
 }
 const checked=data.channels.filter(channel=>channel.enabled).length;
 const adjustable=checkedScaleChannels().length;
 const target=keyboardScaleScope==='current'
  ? currentChannel?.name??'无可调节通道'
  : `已勾选 ${checked} 个通道${checked===adjustable?'':` · 可调节 ${adjustable} 个`}`;
 const label=$('scale-target');
 if(label.textContent!==target)label.textContent=target;
}
scaleScope.onclick=event=>{
 const choice=event.target.closest('button[data-scope]');
 if(!choice)return;
 keyboardScaleScope=choice.dataset.scope;
 updateScaleTarget();
};
function adjustKeyboardScale(larger){
 if(keyboardScaleScope==='current'){
  if(currentChannel)adjustScale(currentChannel,larger);
  return;
 }
 const channels=checkedScaleChannels(),factor=larger?2:.5;
 const scales=channels.map(channel=>channel.vertical.scale*factor);
 // Keep the group together when a channel cannot represent the next scale.
 if(scales.some((scale,i)=>!Number.isFinite(scale)||scale<=0||scale/factor!==channels[i].vertical.scale))return;

 render();
}
function showScaleFields(){
 const hidden=scaleMode.value!=='manual';
 $('scale-fields').hidden=hidden;
 scaleChannel.disabled=scaleValue.disabled=scaleCenter.disabled=hidden;
}
function loadScaleFields(){
 const channel=data.channels[Number(scaleChannel.value)];
 const setting=scaleDrafts.get(channel)??channel.vertical;
 scaleValue.setCustomValidity('');
 scaleValue.value=setting.scale;
 scaleCenter.value=setting.center;
}
function openScaleDialog(channel){
 const drawable=data.channels.filter(c=>c.vertical&&(!channel||c===channel));
 if(!drawable.length)return;
 scaleDrafts=new Map();
 $('scale-title').textContent=channel?'调整通道纵轴':'导入时设置纵轴';
 $('scale-mode-label').hidden=Boolean(channel);
 scaleMode.value=channel?'manual':'auto';
 scaleChannel.replaceChildren(...drawable.map(c=>new Option(c.name,data.channels.indexOf(c))));
 loadScaleFields();
 showScaleFields();
 scaleDialog.showModal();
}
scaleMode.onchange=showScaleFields;
scaleChannel.onchange=loadScaleFields;
function recordScaleDraft(){
 const scale=scaleValue.valueAsNumber,center=scaleCenter.valueAsNumber;
 scaleValue.setCustomValidity(scale>0&&Number.isFinite(scale)?'':'每格数值须为大于零的有限数值。');
 if(scaleValue.validity.valid&&scaleCenter.validity.valid){
  scaleDrafts.set(data.channels[Number(scaleChannel.value)],{scale,center});
 }
}
scaleValue.oninput=scaleCenter.oninput=recordScaleDraft;
$('scale-form').onsubmit=event=>{
 if(event.submitter?.value==='apply'&&scaleMode.value==='manual'){
  for(const [channel,setting] of scaleDrafts)setChannelScale(channel,setting);
  render();
 }
};

function render(){
 if(!data)return;
 const rect=cv.getBoundingClientRect(),dpr=devicePixelRatio||1,w=rect.width,h=rect.height;
 cv.width=w*dpr;cv.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 const left=plotLeft,right=w-plotRight,top=22,bottom=h-38,width=right-left,range=Math.max(1e-9,view[1]-view[0]);
 const [fullStart,fullEnd]=fullRange();
 if(visibleRanges?.view!==view){
  const isFullView=view[0]===fullStart&&view[1]===fullEnd;
  visibleRanges={view,ranges:data.channels.map(channel=>isFullView?channel.fullBounds:bounds(channel,view))};
 }
 $('zoom').disabled=range<=1;
 $('zoom-out').disabled=range>=fullEnd-fullStart;
 updateChannelSelection();
 updateScaleTarget();
 updateVerticalPan();
 const reference=currentChannel?.enabled?currentChannel:data.channels.find(channel=>channel.enabled&&channel.vertical);
 $('scale-reference').textContent=reference?`· 刻度参考 ${reference.name}`:'';
 ctx.font='12px system-ui';ctx.strokeStyle='#2b394e';ctx.fillStyle='#aebed3';const ticks=w<500?3:5;for(let k=0;k<=ticks;k++){const x=left+width*k/ticks,t=view[0]+range*k/ticks;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.textAlign=k===0?'left':k===ticks?'right':'center';ctx.fillText(axis.value==='record'?String(Math.round(t)):t.toFixed(2),x,bottom+23)}
 ctx.textAlign='right';ctx.textBaseline='middle';
 const divisionHeight=(bottom-top)/yDivisions;
 for(let k=0;k<=yDivisions;k++){
  const y=top+divisionHeight*k;
  ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
  if(reference){
   const {center,scale}=reference.vertical;
   ctx.fillText(plotNumber(center+(yDivisions/2-k)*scale),left-7,y,left-11);
  }
 }
 // Paint the current channel last while retaining the original table and range indices.
 const drawOrder=data.channels.map((_,index)=>index);
 const foreground=data.channels.indexOf(currentChannel);
 if(foreground>=0){
  drawOrder.splice(foreground,1);
  drawOrder.push(foreground);
 }
 let overflowing=0;
 for(const index of drawOrder){
  const c=data.channels[index];
  const {min:lo,max:hi}=visibleRanges.ranges[index];
  const hasVisibleValues=Number.isFinite(lo);
  const t=xValue(selected),value=c.value(selected);
  let overflow='';
  if(c.enabled&&c.vertical&&hasVisibleValues){
   const overTop=divisionsFromCenter(hi,c.vertical)>yDivisions/2;
   const overBottom=divisionsFromCenter(lo,c.vertical)<-yDivisions/2;
   if(overTop||overBottom){
    overflow=`${overTop&&overBottom?'↑↓':overTop?'↑':'↓'} 超出纵轴`;
    overflowing++;
   }
   ctx.save();
   ctx.beginPath();ctx.rect(left,top,width,bottom-top);ctx.clip();
   ctx.strokeStyle=c.color;ctx.lineWidth=1.4;ctx.beginPath();
   const dots=new Path2D(),radius=2.1;
   const yValue=sample=>(top+bottom)/2-divisionsFromCenter(sample,c.vertical)*divisionHeight;
   let started=false,bucket=-1,points=[];
   function flush(){
    if(!points.length)return;
    let min=0,max=0;
    for(let i=1;i<points.length;i++){
     if(points[i][1]<points[min][1])min=i;
     if(points[i][1]>points[max][1])max=i;
    }
    const keep=[...new Set([0,min,max,points.length-1])].sort((a,b)=>a-b);
    for(const i of keep){
     const [x,sample]=points[i],y=yValue(sample);
     if(!Number.isFinite(y)){started=false;continue}
     if(started)ctx.lineTo(x,y);else{ctx.moveTo(x,y);started=true}
     dots.moveTo(x+radius,y);dots.arc(x,y,radius,0,2*Math.PI);
    }
    points=[];
   }
   for(let i=0;i<data.count;i++){
    const t=xValue(i);
    if(t<view[0]||t>view[1]){flush();started=false;continue}
    const value=c.value(i);
    if(!isPlotNumber(value)){flush();started=false;continue}
    const x=left+(t-view[0])/range*width,px=Math.floor(x);
    if(px!==bucket){flush();bucket=px}
    points.push([x,value]);
   }
   flush();ctx.stroke();ctx.fillStyle=c.color;ctx.fill(dots);
   if(t>=view[0]&&t<=view[1]&&isPlotNumber(value)&&Math.abs(divisionsFromCenter(value,c.vertical))<=yDivisions/2){
    const x=left+(t-view[0])/range*width,y=yValue(value);
    ctx.beginPath();ctx.arc(x,y,radius,0,2*Math.PI);ctx.fill();
    ctx.strokeStyle='#f2f6ff';ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);ctx.stroke();
   }
   ctx.restore();
  }
  const {row,name,checkbox,readings,scale,overflow:scaleNote}=c.row;
  row.classList.toggle('current-channel',c===currentChannel);
  name.setAttribute('aria-pressed',String(c===currentChannel));
  checkbox.checked=c.enabled;
  readings[0].textContent=format(value);
  readings[1].textContent=hasVisibleValues?format(lo):'不可绘制';
  readings[2].textContent=hasVisibleValues?format(hi):'不可绘制';
  scale.textContent=c.vertical?`${plotNumber(c.vertical.scale)} 单位/格`:'—';
  scaleNote.hidden=!overflow;
  scaleNote.textContent=overflow;
 }
 $('scale-overflow').textContent=overflowing?`${overflowing} 个通道超出纵轴`:'';
 const x=left+(xValue(selected)-view[0])/range*width;if(x>=left&&x<=right){ctx.strokeStyle='#f2f6ff';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.setLineDash([])}
 $('position').textContent=`记录 ${selected+1} / ${data.count} · 源时间 ${data.times[selected]} ms`;$('cursor').value=selected;
}
function select(i,follow=false){
 if(!data)return;
 selected=Math.max(0,Math.min(data.count-1,i));
 if(follow)centerViewOnSelection(view[1]-view[0]);
 render();
}
async function loadFile(file){
 const ticket=++generation;
 if(scaleDialog.open)scaleDialog.close();
 data=null;hostWindowUs=null;axis.disabled=true;currentChannel=null;visibleRanges=null;scaleDrafts.clear();
 $('zoom').disabled=true;$('zoom-out').disabled=true;updateChannelSelection();
 scaleScope.hidden=true;
 $('timing').hidden=true;$('timing-file').value='';$('timing-file').disabled=true;$('timing-note').textContent='';
 $('plot-area').hidden=true;$('empty').style.display='block';$('plot-caption').hidden=true;$('channels').replaceChildren();
 $('notice').textContent='';$('metadata').textContent='';$('position').textContent='尚无记录';
 $('status').textContent='正在校验并读取本地文件…';
 try{
  need(file.size<=64*1024*1024,'初版单文件上限为 64 MiB');
  const parsed=await parseCapture(await file.arrayBuffer());
  if(ticket!==generation)return;
  data=parsed;selected=0;axis.value=data.clockMismatch?'record':'source';axis.disabled=false;fitView();
  setupChannelRows();
  $('cursor').max=data.count-1;$('timing-file').disabled=!data.complete;
  scaleScope.hidden=false;
  $('empty').style.display='none';$('plot-area').hidden=false;$('plot-caption').hidden=false;
  $('status').textContent=`${file.name} · ${data.count.toLocaleString()} 条完整记录 · ${data.channels.length} 通道 · ${data.state}`;
  $('notice').textContent=data.warnings.join('\n');
  $('metadata').textContent=JSON.stringify({header:data.header,manifest:data.manifest,verified_payload_sha256:data.sha},null,2);
  showTiming();render();openScaleDialog();
 }catch(e){
  if(ticket!==generation)return;
  $('status').textContent=`无法打开：${e.message}`;$('empty').textContent='请选择受支持且包含有效记录的文件。';data=null;
 }
}
async function loadTiming(file){
 const capture=data,ticket=++timingGeneration;
 if(!capture?.complete)return;
 hostWindowUs=null;showTiming();
 try{
  need(file.size<=16*1024*1024,'诊断 JSON 超出 16 MiB');
  const receipt=JSON.parse(await file.text());
  if(data!==capture||ticket!==timingGeneration)return;
  hostWindowUs=measuredHostWindow(receipt,capture);showTiming();
  $('timing-note').textContent=`已关联诊断计时：${file.name}`;
 }catch(e){
  if(data!==capture||ticket!==timingGeneration)return;
  $('timing-note').textContent=`无法关联诊断计时：${e.message}`;
 }
}
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
$('timing-file').onchange=e=>{if(e.target.files[0])loadTiming(e.target.files[0])};
function showFullRange(){if(data){fitView();render()}}
axis.onchange=$('fit').onclick=showFullRange;
$('cursor').oninput=e=>select(Number(e.target.value),true);
$('prev').onclick=()=>select(selected-1,true);
$('next').onclick=()=>select(selected+1,true);
$('zoom').onclick=()=>zoomAtSelection(.5);
$('zoom-out').onclick=()=>zoomAtSelection(2);
selectAll.onchange=()=>{
 if(!data)return;
 for(const channel of data.channels)channel.enabled=selectAll.checked;
 render();
};
document.addEventListener('keydown',event=>{
 const target=event.target;
 if(!data||scaleDialog.open||event.defaultPrevented||event.isComposing||event.altKey||event.metaKey||
    !(target instanceof Element)||!target.closest('#viewer-toolbar,#plot-area,.controls,#channel-table,.channel-controls')||
    target.isContentEditable||target.matches('input:not([type=checkbox]):not([type=range]),select,textarea'))return;
 if(event.ctrlKey){
  if(event.shiftKey||event.key.toLowerCase()!=='h')return;
  event.preventDefault();
  showFullRange();
  return;
 }
 switch(event.key){
  case 'ArrowLeft':select(selected-1,true);break;
  case 'ArrowRight':select(selected+1,true);break;
  case '[':zoomAtSelection(2);break;
  case ']':zoomAtSelection(.5);break;
  case '-':adjustKeyboardScale(true);break;
  case '+':adjustKeyboardScale(false);break;
  default:return;
 }
 event.preventDefault();
});
scaleDialog.addEventListener('close',()=>{
 if(data&&!$('scale-mode-label').hidden)cv.focus({preventScroll:true});
});
cv.onclick=e=>{if(!data)return;const r=cv.getBoundingClientRect(),t=view[0]+(e.clientX-r.left-plotLeft)/(r.width-plotLeft-plotRight)*(view[1]-view[0]);let nearest=0,dist=Infinity;for(let i=0;i<data.count;i++){const d=Math.abs(xValue(i)-t);if(d<dist){dist=d;nearest=i}}select(nearest)};window.addEventListener('resize',render);
window.HssViewer={parseCapture,loadFile,getData:()=>data};
</script></body></html>
