[workspace]
members = [
    "crates/jlink-capture",
    "crates/jlink-domain",
    "crates/jlink-mcp",
    "crates/jlink-worker",
]
resolver = "3"

[workspace.dependencies]
crc32fast = "=1.5.0"
data-encoding = "=2.11.1"
gimli = { version = "=0.32.3", default-features = false, features = ["read", "std"] }
jsonschema = { version = "=0.51.0", default-features = false }
object = { version = "=0.37.3", default-features = false, features = ["elf", "read_core", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading"] }

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "1.0.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
