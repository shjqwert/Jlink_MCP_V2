[workspace]
members = [
    "crates/jlink-capture",
    "crates/jlink-domain",
    "crates/jlink-mcp",
    "crates/jlink-worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
