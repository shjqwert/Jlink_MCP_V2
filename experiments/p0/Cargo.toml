[workspace]
members = ["f0a-hss", "f0b-worker", "f0c-dwarf"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.99"
crc32fast = "1.5.0"
gimli = "0.32.3"
libloading = "0.8.8"
object = "0.37.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
windows-sys = { version = "0.61.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
